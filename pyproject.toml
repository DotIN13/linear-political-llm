[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lpl"
version = "0.0.0"
description = "Linear probes on political images and language-model outputs"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lpl*"]

[tool.pytest.ini_options]
testpaths = ["bench_v2/tests", "probes", "lpl"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
